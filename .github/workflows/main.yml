name: HANSAKA MD Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.js', '.github/workflows/bot.yml']
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Packages
        run: npm install

      - name: Run HANSAKA MD Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "Starting HANSAKA MD Bot..."
          timeout 340m node index.js || true
          echo "Bot stopped"
