name: techlogiclk scraper

on:
  workflow_dispatch:        # Manual run - Actions tab එකෙන් button එකෙන් run කරන්න
  schedule:
    - cron: "0 3 * * *"     # දිනපතා UTC 03:00 (ලංකාවේ 08:30 am) - ඕන නැත්නම් මේ line එක delete කරන්න

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scraper and upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node scraper.js
