name: Siaabot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.js', '.github/workflows/bot.yml']
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Packages
        run: npm install

      - name: Run Tech Malli Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          AUTH_STATE: ${{ secrets.AUTH_STATE }}
        run: |
          echo "Starting Tech Malli Bot..."
          echo "Phone: $PHONE_NUMBER"
          timeout 340m node index.js || true
          echo "Bot stopped"
